name: Keep backend warm

on:
  schedule:
    # Every 10 minutes, comfortably under Render's 15-minute free-plan spin-down.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -f "${{ vars.BACKEND_URL }}/actuator/health"
