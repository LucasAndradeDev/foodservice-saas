spring:
  application:
    name: warehouse-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

warehouse:
  # Shared with the Morá backend - verifies the SSO handoff token instead of minting it.
  # Deliberately NOT the same secret as jwt-secret below.
  sso-secret: ${WAREHOUSE_SSO_SECRET}
  # Signs this app's own session token, minted after a handoff is verified. Never shared
  # with Morá - a leak here can't be used to forge anything on the Morá side.
  jwt-secret: ${WAREHOUSE_JWT_SECRET}
  jwt-expiration-ms: ${WAREHOUSE_JWT_EXPIRATION_MS:86400000}

# MoraApiClient calls this to pull delivered sales for the stock sync (docs/ARMAZEM_MORA.md).
# Local default assumes the Morá backend running on its own default port (8080).
mora:
  internal-base-url: ${MORA_BACKEND_URL:http://localhost:8080}

# Shared secret for the GitHub Actions cron that triggers POST /api/v1/internal/sync every 15
# minutes - same pattern as Morá's backup.trigger-token.
sync:
  trigger-token: ${SYNC_TRIGGER_TOKEN:}

server:
  port: ${PORT:8081}

# Off by default in a deployed environment - the API surface (endpoints, DTO shapes, param
# names) is handed out to anyone unauthenticated otherwise. Left on by default here so local
# dev/Postman/tests keep working without extra setup. Same convention as the Morá backend.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
