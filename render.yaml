services:
  - name: mora-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend/
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Restricted runtime role for Hibernate (RLS, Camada 3 - see docs/RLS_DESIGN.md).
      # Same host/database as SPRING_DATASOURCE_URL above, different role - Flyway and
      # BackupService keep using the owner role (SPRING_DATASOURCE_*) directly.
      # APP_DATASOURCE_RUNTIME_URL MUST be Neon's DIRECT connection string ("Connection
      # pooling" toggle OFF in Neon's Connect modal - no "-pooler" in the host). The pooled
      # endpoint silently breaks RLS: TenantAwareDataSource's session-level set_config can
      # get orphaned when PgBouncer reassigns the logical connection to a different backend
      # between transactions. Learned this in production on 2026-08-11 - see
      # docs/RLS_DESIGN.md, Achado 4, before changing this back to a pooled URL.
      - key: APP_DATASOURCE_RUNTIME_URL
        sync: false
      - key: APP_DATASOURCE_RUNTIME_USERNAME
        sync: false
      - key: APP_DATASOURCE_RUNTIME_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      # SSO into Armazém Morá (docs/ARMAZEM_MORA.md) - shared with the warehouse-backend
      # service below. Deliberately a different secret from JWT_SECRET.
      - key: WAREHOUSE_SSO_SECRET
        sync: false
      - key: WAREHOUSE_FRONTEND_URL
        value: https://armazem-mora.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      # Swagger/OpenAPI docs hand out the entire API surface to anyone unauthenticated -
      # off in production, on by default everywhere else (see application.yml).
      - key: SWAGGER_ENABLED
        value: "false"
      # The refresh-token cookie's Secure flag - production is served over https end to end
      # (default is false, since Chrome refuses to store a Secure cookie set over plain http).
      - key: COOKIE_SECURE
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      # AES-256 master key for CredentialEncryptionService (Pix credentials at rest,
      # docs/PIX_PAYMENT.md). Base64, 32 bytes - generate with `openssl rand -base64 32`.
      - key: PIX_ENCRYPTION_KEY
        sync: false
      # Error tracking (Sentry). Blank in application.yml's default leaves the SDK disabled -
      # set the real DSN by hand in the Render dashboard once a Sentry project exists.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - name: mora-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # After the first deploy, add a Rewrite rule in the Render dashboard
    # (Settings > Redirects/Rewrites) for this service:
    #   Source: /api/*
    #   Destination: https://mora-backend.onrender.com/api/*
    #   Action: Rewrite
    # This proxies API calls server-side so the frontend keeps using its existing
    # relative "/api/v1" base URL, with no CORS setup needed.
    envVars:
      # Error tracking (Sentry). VITE_ vars are baked in at build time by the buildCommand
      # above - blank/unset leaves the SDK disabled, same posture as the backend's SENTRY_DSN.
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production

  # Armazém Morá - separate app, separate database, see docs/ARMAZEM_MORA.md.
  # warehouse-frontend service entry added here once that app exists (backend first).
  - name: warehouse-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: warehouse-backend/Dockerfile
    dockerContext: warehouse-backend/
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Same secret as mora-backend's WAREHOUSE_SSO_SECRET above - verifies the handoff
      # token instead of minting it.
      - key: WAREHOUSE_SSO_SECRET
        sync: false
      # Signs this app's own session token, minted after a handoff is verified. Never
      # shared with Morá - deliberately a different secret from WAREHOUSE_SSO_SECRET.
      - key: WAREHOUSE_JWT_SECRET
        sync: false
      # MoraApiClient pulls delivered sales from here for the stock sync.
      - key: MORA_BACKEND_URL
        value: https://mora-backend.onrender.com
      # Shared secret for the GitHub Actions cron that triggers POST /api/v1/internal/sync.
      - key: SYNC_TRIGGER_TOKEN
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
