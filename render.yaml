services:
  - name: mora-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend/
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Restricted runtime role for Hibernate (RLS, Camada 3 - see docs/RLS_DESIGN.md).
      # Same host/database as SPRING_DATASOURCE_URL above, different role - Flyway and
      # BackupService keep using the owner role (SPRING_DATASOURCE_*) directly.
      # APP_DATASOURCE_RUNTIME_URL MUST be Neon's DIRECT connection string ("Connection
      # pooling" toggle OFF in Neon's Connect modal - no "-pooler" in the host). The pooled
      # endpoint silently breaks RLS: TenantAwareDataSource's session-level set_config can
      # get orphaned when PgBouncer reassigns the logical connection to a different backend
      # between transactions. Learned this in production on 2026-08-11 - see
      # docs/RLS_DESIGN.md, Achado 4, before changing this back to a pooled URL.
      - key: APP_DATASOURCE_RUNTIME_URL
        sync: false
      - key: APP_DATASOURCE_RUNTIME_USERNAME
        sync: false
      - key: APP_DATASOURCE_RUNTIME_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      # Swagger/OpenAPI docs hand out the entire API surface to anyone unauthenticated -
      # off in production, on by default everywhere else (see application.yml).
      - key: SWAGGER_ENABLED
        value: "false"
      # The refresh-token cookie's Secure flag - production is served over https end to end
      # (default is false, since Chrome refuses to store a Secure cookie set over plain http).
      - key: COOKIE_SECURE
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false

  - name: mora-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # After the first deploy, add a Rewrite rule in the Render dashboard
    # (Settings > Redirects/Rewrites) for this service:
    #   Source: /api/*
    #   Destination: https://mora-backend.onrender.com/api/*
    #   Action: Rewrite
    # This proxies API calls server-side so the frontend keeps using its existing
    # relative "/api/v1" base URL, with no CORS setup needed.
