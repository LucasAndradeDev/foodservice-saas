spring:
  application:
    name: restaurant-saas

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
    # Explicit owner-role credentials so Flyway doesn't pick up the restricted
    # `dataSource` bean (RuntimeDataSourceConfig) and fail on migration DDL.
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

api:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
    admin-expiration-ms: 43200000

admin:
  username: ${ADMIN_USERNAME:}
  password-hash: ${ADMIN_PASSWORD_HASH:}

security:
  login-rate-limit:
    max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${LOGIN_RATE_LIMIT_BLOCK_MINUTES:15}
  forgot-password-rate-limit:
    max-attempts: ${FORGOT_PASSWORD_RATE_LIMIT_MAX_ATTEMPTS:3}
    window-minutes: ${FORGOT_PASSWORD_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${FORGOT_PASSWORD_RATE_LIMIT_BLOCK_MINUTES:30}
  password-reset-token:
    expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
  email-verification-token:
    expiration-minutes: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MINUTES:1440}
  resend-verification-rate-limit:
    max-attempts: ${RESEND_VERIFICATION_RATE_LIMIT_MAX_ATTEMPTS:3}
    window-minutes: ${RESEND_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${RESEND_VERIFICATION_RATE_LIMIT_BLOCK_MINUTES:30}
  reservation-create-rate-limit:
    max-attempts: ${RESERVATION_CREATE_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${RESERVATION_CREATE_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${RESERVATION_CREATE_RATE_LIMIT_BLOCK_MINUTES:30}
  reservation-cancel-rate-limit:
    max-attempts: ${RESERVATION_CANCEL_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${RESERVATION_CANCEL_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${RESERVATION_CANCEL_RATE_LIMIT_BLOCK_MINUTES:30}
  admin-login-rate-limit:
    max-attempts: ${ADMIN_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${ADMIN_LOGIN_RATE_LIMIT_BLOCK_MINUTES:60}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    provider: ${STORAGE_PROVIDER:local}
  email:
    provider: ${EMAIL_PROVIDER:log}
  datasource:
    runtime:
      url: ${APP_DATASOURCE_RUNTIME_URL}
      username: ${APP_DATASOURCE_RUNTIME_USERNAME}
      password: ${APP_DATASOURCE_RUNTIME_PASSWORD}
      driver-class-name: org.postgresql.Driver

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:uploads}
  backup-bucket: ${SUPABASE_BACKUP_BUCKET:backups}

backup:
  trigger-token: ${BACKUP_TRIGGER_TOKEN:}
  retention-count: ${BACKUP_RETENTION_COUNT:14}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:Morá}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-flash-latest}
  base-url: https://generativelanguage.googleapis.com

server:
  port: ${PORT:8080}
