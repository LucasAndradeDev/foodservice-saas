spring:
  application:
    name: restaurant-saas

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
    # Explicit owner-role credentials so Flyway doesn't pick up the restricted
    # `dataSource` bean (RuntimeDataSourceConfig) and fail on migration DDL.
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      # Menu import accepts several photos in one request (import from PDF/images) -
      # raised above max-file-size so multiple files can be combined in one upload.
      max-request-size: 40MB

api:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
    admin-expiration-ms: 43200000

cookie:
  # The refresh-token cookie's Secure flag. Chrome silently refuses to store a Secure cookie set
  # over plain http, so this must stay false for local dev/tests (http://localhost) - render.yaml
  # sets it true in production, which is served over https end to end.
  secure: ${COOKIE_SECURE:false}

admin:
  username: ${ADMIN_USERNAME:}
  password-hash: ${ADMIN_PASSWORD_HASH:}
  email: ${ADMIN_EMAIL:}

security:
  login-rate-limit:
    max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${LOGIN_RATE_LIMIT_BLOCK_MINUTES:15}
  forgot-password-rate-limit:
    max-attempts: ${FORGOT_PASSWORD_RATE_LIMIT_MAX_ATTEMPTS:3}
    window-minutes: ${FORGOT_PASSWORD_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${FORGOT_PASSWORD_RATE_LIMIT_BLOCK_MINUTES:30}
  password-reset-token:
    expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
  email-verification-token:
    expiration-minutes: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MINUTES:1440}
  resend-verification-rate-limit:
    max-attempts: ${RESEND_VERIFICATION_RATE_LIMIT_MAX_ATTEMPTS:3}
    window-minutes: ${RESEND_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${RESEND_VERIFICATION_RATE_LIMIT_BLOCK_MINUTES:30}
  reservation-create-rate-limit:
    max-attempts: ${RESERVATION_CREATE_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${RESERVATION_CREATE_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${RESERVATION_CREATE_RATE_LIMIT_BLOCK_MINUTES:30}
  reservation-cancel-rate-limit:
    max-attempts: ${RESERVATION_CANCEL_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${RESERVATION_CANCEL_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${RESERVATION_CANCEL_RATE_LIMIT_BLOCK_MINUTES:30}
  admin-login-rate-limit:
    max-attempts: ${ADMIN_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${ADMIN_LOGIN_RATE_LIMIT_BLOCK_MINUTES:60}
  admin-forgot-password-rate-limit:
    max-attempts: ${ADMIN_FORGOT_PASSWORD_RATE_LIMIT_MAX_ATTEMPTS:3}
    window-minutes: ${ADMIN_FORGOT_PASSWORD_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${ADMIN_FORGOT_PASSWORD_RATE_LIMIT_BLOCK_MINUTES:30}
  reservation-lookup-rate-limit:
    max-attempts: ${RESERVATION_LOOKUP_RATE_LIMIT_MAX_ATTEMPTS:20}
    window-minutes: ${RESERVATION_LOOKUP_RATE_LIMIT_WINDOW_MINUTES:15}
    block-minutes: ${RESERVATION_LOOKUP_RATE_LIMIT_BLOCK_MINUTES:15}
  public-order-phone-rate-limit:
    # Caps how many times the same WhatsApp number can be handed to the public,
    # unauthenticated self-order endpoint - stops it being used to spam an arbitrary
    # phone number with "your order is ready" notifications.
    max-attempts: ${PUBLIC_ORDER_PHONE_RATE_LIMIT_MAX_ATTEMPTS:3}
    window-minutes: ${PUBLIC_ORDER_PHONE_RATE_LIMIT_WINDOW_MINUTES:60}
    block-minutes: ${PUBLIC_ORDER_PHONE_RATE_LIMIT_BLOCK_MINUTES:120}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  warehouse-frontend-url: ${WAREHOUSE_FRONTEND_URL:http://localhost:5174}
  # Master key for CredentialEncryptionService (base64, 32 bytes) - never in the database, same
  # posture as warehouse.sso-secret/brevo.api-key below.
  credential-encryption-key: ${PIX_ENCRYPTION_KEY}
  storage:
    provider: ${STORAGE_PROVIDER:local}
  email:
    provider: ${EMAIL_PROVIDER:log}
  datasource:
    runtime:
      url: ${APP_DATASOURCE_RUNTIME_URL}
      username: ${APP_DATASOURCE_RUNTIME_USERNAME}
      password: ${APP_DATASOURCE_RUNTIME_PASSWORD}
      driver-class-name: org.postgresql.Driver

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:uploads}
  backup-bucket: ${SUPABASE_BACKUP_BUCKET:backups}

backup:
  trigger-token: ${BACKUP_TRIGGER_TOKEN:}
  retention-count: ${BACKUP_RETENTION_COUNT:14}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:Morá}

warehouse:
  # Shared with the Armazém Morá backend - see WarehouseHandoffTokenService and
  # docs/ARMAZEM_MORA.md. Deliberately not the same secret as api.jwt.secret above.
  sso-secret: ${WAREHOUSE_SSO_SECRET}

woovi:
  # Each restaurant's actual AppID lives encrypted in pix_integrations - this is just the API's
  # base URL, same for every account.
  base-url: ${WOOVI_BASE_URL:https://api.woovi.com}

gemini:
  api-key: ${GEMINI_API_KEY}
  # Comma-separated, tried in order. Free-tier quota/overload (429/503) is enforced per
  # model, so a model that's exhausted or overloaded falls through to the next one.
  models: ${GEMINI_MODELS:gemini-flash-latest,gemini-3.6-flash,gemini-3.1-flash-lite}
  base-url: https://generativelanguage.googleapis.com

sentry:
  # Blank dsn (the default) leaves the SDK disabled - it only reports errors once a real
  # DSN is set (production only, see render.yaml). Never enabled in local dev/tests.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  # No performance tracing - error reporting only, to stay on Sentry's free tier.
  traces-sample-rate: 0.0

server:
  port: ${PORT:8080}

# Off by default in a deployed environment (see render.yaml) - the API surface (endpoints, DTO
# shapes, param names) is handed out to anyone unauthenticated otherwise, which is free
# reconnaissance for an attacker. Left on by default here so local dev/Postman/tests keep working
# without extra setup.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
