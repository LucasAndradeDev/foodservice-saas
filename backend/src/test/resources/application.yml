spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant_saas
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # Owner-role credentials, same as spring.datasource above — kept explicit so Flyway
    # doesn't pick up the restricted `dataSource` bean (RuntimeDataSourceConfig).
    url: jdbc:postgresql://localhost:5432/restaurant_saas
    user: postgres
    password: postgres

